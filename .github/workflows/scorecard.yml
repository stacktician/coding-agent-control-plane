name: Scorecard

# OpenSSF Scorecard: an automated review of this repository's supply-chain practices (pinned
# dependencies, token permissions, branch rules, SAST, dependency updates, known vulnerabilities).
# The result goes to code scanning and, with publish_results, to the public scorecard.dev entry.
on:
  branch_protection_rule:
  schedule:
    - cron: "33 7 * * 1"  # Mondays, 07:33 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write  # upload the SARIF to code scanning
      id-token: write  # publish_results signs the result with the workflow's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the result as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: results.sarif
