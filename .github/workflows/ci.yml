name: CI

# The same gate as CLAUDE.md's "before you call a change done", on every push to every branch
# and on every pull request. The Agent SDK is faked in tests, so this spends no model usage.
# A newer push to the same branch cancels the run it supersedes. Dependabot's branches are
# tested through their pull requests only, so one commit does not get two competing runs.
on:
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
