name: Images

# Builds the sandbox image and scans it with Trivy, and scans every image pinned in compose.yaml.
# Runs on every push and pull request so the check always reports (the work is skipped when no
# image input changed), and weekly regardless, because images age without a commit.
# Policy: a fixed critical or high finding in our own image fails the build; findings in upstream
# images are reported to code scanning only, since their fix is the tag bump Dependabot proposes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  push:
    branches-ignore: ["dependabot/**"]  # Dependabot branches are tested through their PRs
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.diff.outputs.affected }}
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Did an image input change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          # A pull request diffs against its base; a push diffs against the branch's previous tip.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(deploy/mcp-sandbox/|compose\.yaml$|pyproject\.toml$|uv\.lock$|src/|\.trivyignore$|\.github/workflows/images\.yml$)'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "No image input changed; the build and the scans are not needed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: List the images pinned in compose.yaml
        id: list
        run: |
          images=$(grep -E '^\s*image:' compose.yaml | awk '{print $2}' \
            | jq -R '{ref: ., name: (split("@")[0] | split("/") | last | split(":")[0])}' | jq -sc .)
          echo "images=$images" >> "$GITHUB_OUTPUT"

  sandbox-image:
    name: Sandbox image
    needs: scope
    if: needs.scope.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: docker build --file deploy/mcp-sandbox/Dockerfile --tag sandbox-mcp:scan .
      - name: Report every critical and high finding to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sandbox-mcp:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-sandbox.sarif
      - name: Upload the report
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy-sandbox.sarif
          category: trivy-sandbox-image
      - name: Fail on a fixed critical or high finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sandbox-mcp:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

  upstream-images:
    name: Upstream ${{ matrix.image.name }}
    needs: scope
    if: needs.scope.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.scope.outputs.images) }}
    steps:
      - name: Scan ${{ matrix.image.ref }} (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
      - name: Upload the report
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-upstream-${{ matrix.image.name }}
