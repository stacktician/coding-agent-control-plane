# Keeps every pin current: Python packages (uv.lock), Compose images, the sandbox-mcp base
# image and the GitHub actions. CI must be green before an update is merged.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/mcp-sandbox
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
